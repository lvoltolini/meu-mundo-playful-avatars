<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Tênis para 2</title>
<style>html,body{margin:0;height:100%;background:#2f5d50;overflow:hidden}canvas{width:100vw;height:100vh;object-fit:contain;display:block}</style>
</head><body><canvas id="c" width="800" height="600" tabindex="0"></canvas>
<script src="_bridge.js"></script><script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=800,H=600,PH=120,keys={},WIN=5;let s;
function reset(){s={p:[H/2,H/2],sc:[0,0],bx:W/2,by:H/2,vx:4,vy:2,started:false,over:false};}
function serve(d){s.bx=W/2;s.by=H/2;s.vx=4*d;s.vy=(Math.random()*4-2);}
reset();
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();if(!s.started||s.over){if(s.over)reset();s.started=true;sendEvent('inicio',{jogo:'Tênis'});}}if(e.code.startsWith('Arrow'))e.preventDefault();});
addEventListener('keyup',e=>keys[e.code]=false);c.addEventListener('click',()=>c.focus());
function point(i){s.sc[i]++;sendEvent('ponto',{jogo:'Tênis',jogador:CFG.players[i].name,placar:s.sc.join(' x ')});
 if(s.sc[i]>=WIN){s.over=true;sendEvent('fim',{jogo:'Tênis',vencedor:CFG.players[i].name,placar:s.sc.join(' x ')});}else serve(i===0?1:-1);}
function step(){if(!s.started||s.over)return;
 if(keys.KeyW)s.p[0]-=7;if(keys.KeyS)s.p[0]+=7;if(keys.ArrowUp)s.p[1]-=7;if(keys.ArrowDown)s.p[1]+=7;
 s.p=s.p.map(v=>Math.max(PH/2,Math.min(H-PH/2,v)));
 s.bx+=s.vx;s.by+=s.vy;if(s.by<15||s.by>H-15)s.vy*=-1;
 [[45,0],[W-45,1]].forEach(([px,i])=>{if(Math.abs(s.bx-px)<18&&Math.abs(s.by-s.p[i])<PH/2+12&&(i===0?s.vx<0:s.vx>0)){
  s.vx=-s.vx*1.05;s.vy=(s.by-s.p[i])/8;}});
 if(s.bx<0)point(1);if(s.bx>W)point(0);}
function paddle(i,px){x.fillStyle=i===0?'#3b82a6':'#c2703d';x.beginPath();x.roundRect(px-10,s.p[i]-PH/2,20,PH,10);x.fill();
 drawAvatar(x,i,px+(i===0?-0:0),s.p[i],40);drawEmoji(x,CFG.racket,px,s.p[i]-PH/2-16,26);}
function draw(){x.fillStyle='#2f5d50';x.fillRect(0,0,W,H);x.strokeStyle='rgba(255,255,255,.4)';x.setLineDash([10,12]);x.beginPath();x.moveTo(W/2,0);x.lineTo(W/2,H);x.stroke();x.setLineDash([]);
 paddle(0,45);paddle(1,W-45);drawEmoji(x,CFG.ball,s.bx,s.by,30);
 x.fillStyle='#fff';x.font='22px sans-serif';x.textAlign='center';x.fillText(CFG.players[0].name+'  '+s.sc[0]+'  x  '+s.sc[1]+'  '+CFG.players[1].name,W/2,30);
 if(!s.started||s.over){x.fillStyle='rgba(20,40,34,.85)';x.fillRect(150,210,500,180);x.fillStyle='#fff';x.font='28px sans-serif';
  x.fillText(s.over?(s.sc[0]>s.sc[1]?CFG.players[0].name:CFG.players[1].name)+' venceu! 🎉':'Tênis para 2 jogadores',400,260);
  x.font='18px sans-serif';x.fillText('Esquerda: W / S     Direita: ↑ / ↓',400,300);x.fillText('Quem fizer '+WIN+' pontos vence',400,330);x.fillText('Pressione Espaço para '+(s.over?'jogar de novo':'começar'),400,362);}}
(function loop(){step();draw();requestAnimationFrame(loop);})();c.focus();
</script></body></html>
