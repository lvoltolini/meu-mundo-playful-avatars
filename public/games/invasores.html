<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Invasores do Espaço</title>
<style>html,body{margin:0;height:100%;background:#1f2a3a;overflow:hidden}canvas{width:100vw;height:100vh;object-fit:contain;display:block}</style>
</head><body><canvas id="c" width="800" height="600" tabindex="0"></canvas>
<script src="_bridge.js"></script><script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=800,H=600,keys={};let s;
function reset(){s={px:400,b:[],e:[],eb:[],dir:1,score:0,lives:3,over:false,win:false,started:false,cd:0};
 for(let r=0;r<4;r++)for(let k=0;k<8;k++)s.e.push({x:130+k*75,y:70+r*58,a:true});}
reset();
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();if(!s.started||s.over){if(s.over)reset();s.started=true;sendEvent('inicio',{jogo:'Invasores'});}}});
addEventListener('keyup',e=>keys[e.code]=false);
c.addEventListener('click',()=>c.focus());
function end(win){s.over=true;s.win=win;sendEvent('fim',{jogo:'Invasores',jogador:CFG.players[0].name,pontos:s.score,venceu:win});}
function step(){
 if(!s.started||s.over)return;
 if(keys.ArrowLeft||keys.KeyA)s.px-=6; if(keys.ArrowRight||keys.KeyD)s.px+=6; s.px=Math.max(30,Math.min(W-30,s.px));
 s.cd--; if(keys.Space&&s.cd<=0){s.b.push({x:s.px,y:510});s.cd=18;}
 s.b.forEach(b=>b.y-=9); s.b=s.b.filter(b=>b.y>0);
 const alive=s.e.filter(e=>e.a); const sp=0.6+(32-alive.length)*0.05;
 let edge=alive.some(e=>(e.x>W-30&&s.dir>0)||(e.x<30&&s.dir<0));
 if(edge){s.dir*=-1;alive.forEach(e=>e.y+=18);} else alive.forEach(e=>e.x+=s.dir*sp);
 if(Math.random()<0.015&&alive.length){const e=alive[Math.floor(Math.random()*alive.length)];s.eb.push({x:e.x,y:e.y+20});}
 s.eb.forEach(b=>b.y+=4); s.eb=s.eb.filter(b=>b.y<H);
 s.b.forEach(b=>alive.forEach(e=>{if(e.a&&!b.hit&&Math.abs(b.x-e.x)<22&&Math.abs(b.y-e.y)<22){e.a=false;b.hit=true;s.score+=10;}}));
 s.b=s.b.filter(b=>!b.hit);
 s.eb.forEach(b=>{if(!b.hit&&Math.abs(b.x-s.px)<26&&Math.abs(b.y-540)<26){b.hit=true;s.lives--;if(s.lives<=0)end(false);}});
 s.eb=s.eb.filter(b=>!b.hit);
 if(!s.e.some(e=>e.a))end(true); if(alive.some(e=>e.y>490))end(false);
}
function draw(){
 x.fillStyle='#1f2a3a';x.fillRect(0,0,W,H);
 s.e.forEach(e=>e.a&&drawEmoji(x,CFG.enemy,e.x,e.y,40));
 x.fillStyle='#ffd57a';s.b.forEach(b=>x.fillRect(b.x-2,b.y-8,4,14));
 x.fillStyle='#9fd3c7';s.eb.forEach(b=>x.fillRect(b.x-3,b.y-6,6,12));
 drawEmoji(x,CFG.vehicle,s.px,548,58); drawAvatar(x,0,s.px,505,34);
 x.fillStyle='#e8eef5';x.font='20px sans-serif';x.textAlign='left';x.fillText('Pontos: '+s.score,16,24);
 x.textAlign='right';x.fillText('Vidas: '+s.lives+'   Piloto: '+CFG.players[0].name,W-16,24);
 if(!s.started||s.over){x.fillStyle='rgba(31,42,58,.85)';x.fillRect(150,220,500,160);x.fillStyle='#fff';x.textAlign='center';
  x.font='28px sans-serif';x.fillText(!s.started?'Invasores do Espaço':(s.win?'Você conseguiu! 🎉':'Fim de jogo'),400,270);
  x.font='18px sans-serif';x.fillText('← → para mover, Espaço para atirar',400,310);x.fillText('Pressione Espaço para '+(s.over?'jogar de novo':'começar'),400,345);}
}
(function loop(){step();draw();requestAnimationFrame(loop);})();c.focus();
</script></body></html>
